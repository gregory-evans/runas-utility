name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach run.exe to (e.g. v1.1); empty = do not touch any release'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image has no Free Pascal. The Chocolatey "fpc" package was delisted
      # from the community repository, so unpack the official x86_64-win64 distribution.
      - name: Install Free Pascal Compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          Invoke-WebRequest -Uri "https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-win64/fpc-3.2.2.x86_64-win64.tar" -OutFile fpc.tar
          $tarExe = Join-Path $env:SystemRoot "System32\tar.exe"
          & $tarExe -xf fpc.tar; if ($LASTEXITCODE -ne 0) { throw "outer tar extract failed: $LASTEXITCODE" }
          $root = Get-ChildItem -Directory "fpc-*" | Select-Object -First 1
          # The nested archives extract into the current directory (the workspace),
          # not into $root, because tar resolves member paths relative to CWD.
          & $tarExe -xf (Join-Path $root.FullName "binary.x86_64-win64.tar"); if ($LASTEXITCODE -ne 0) { throw "binary tar extract failed: $LASTEXITCODE" }
          Get-ChildItem "x86_64-win64-base*.tar.gz", "units-*.tar.gz" | ForEach-Object {
            & $tarExe -xzf $_.FullName; if ($LASTEXITCODE -ne 0) { throw "extract of $($_.Name) failed: $LASTEXITCODE" }
          }
          $bin = Join-Path (Get-Location) "bin\x86_64-win64"
          if (-not (Test-Path "${bin}\fpc.exe")) { throw "FPC compiler not found after extraction" }
          Add-Content $env:GITHUB_PATH $bin

      - name: Verify FPC
        run: fpc -i

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: run.exe
          path: run.exe

      # Tagged builds (or a manual dispatch with release_tag set) attach the binary
      # to the GitHub release for that tag. Create the release first if it does not
      # exist yet (re-linking a re-pushed tag can lag behind the CI run).
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GITHUB_REF_NAME can be empty on some tag-push events; fall back to GITHUB_REF.
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = ($env:GITHUB_REF -replace '^refs/tags/', '') }
          if ($env:RELEASE_TAG) { $tag = $env:RELEASE_TAG }
          Write-Host "ref=$env:GITHUB_REF ref_name='$env:GITHUB_REF_NAME' release_tag='$env:RELEASE_TAG' tag='$tag'"
          if (-not $tag) { throw "Cannot determine the tag name for this run" }
          gh release view "$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No release for $tag; creating it"
            gh release create "$tag" --title "$tag"
          }
          gh release upload "$tag" run.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
