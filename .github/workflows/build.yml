name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image has no Free Pascal; install the latest stable via Chocolatey.
      # This also guards against regressions on newer FPC versions than local 3.2.2.
      - name: Install Free Pascal Compiler
        run: choco install fpc -y

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: run.exe
          path: run.exe
